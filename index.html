<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-Type documentation</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    :root {
      --bg: #0c0d12; --panel: #161b22; --hover: #21262d; --active: #30363d; --border: #30363d;
      --text: #e6edf3; --muted: #9da7b3; --accent: #58a6ff; --code: #21262d; --focus: #ffb454;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg: #ffffff; --panel: #f6f8fa; --hover: #eaeef2; --active: #d0d7de; --border: #d0d7de;
        --text: #1f2328; --muted: #57606a; --accent: #0969da; --code: #eff1f3; --focus: #bf5700;
      }
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --panel: #f6f8fa; --hover: #eaeef2; --active: #d0d7de; --border: #d0d7de;
      --text: #1f2328; --muted: #57606a; --accent: #0969da; --code: #eff1f3; --focus: #bf5700;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
    a { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    .skip { position: absolute; left: -999px; top: 8px; background: var(--panel); color: var(--text); padding: 8px 12px; z-index: 10; }
    .skip:focus { left: 8px; }

    .layout { display: flex; height: 100vh; }
    #sidebar { width: 290px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
    #sidebar h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 8px 6px; }
    #sidebar ul { list-style: none; margin: 0; padding: 0; }
    .nav-item { display: block; padding: 8px 10px; border-radius: 6px; color: var(--text); text-decoration: none; transition: transform 0.2s, background 0.2s; }
    .nav-item:hover { background: var(--hover); transform: translateX(4px); }
    .nav-item[aria-current="page"] { background: var(--active); font-weight: 600; }

    .tools { display: flex; gap: 6px; margin-bottom: 8px; }
    #search { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
    #theme { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
    #results { margin: 0 0 8px; }
    #results li a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--text); text-decoration: none; }
    #results li a:hover, #results li a:focus { background: var(--hover); }
    #results small { display: block; color: var(--muted); }
    .hint { color: var(--muted); font-size: 0.8rem; margin: 0 8px 8px; }

    main { flex: 1; overflow-y: auto; padding: 40px; max-width: 1000px; }
    main h1, main h2, main h3 { border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    main pre { background: var(--panel); padding: 15px; border-radius: 8px; overflow-x: auto; position: relative; }
    main code { background: var(--code); padding: 2px 5px; border-radius: 4px; }
    main pre code { background: none; padding: 0; }
    main table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
    main th, main td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
    main blockquote { border-left: 4px solid var(--accent); margin-left: 0; padding-left: 12px; color: var(--muted); }
    main img { max-width: 100%; }
    .copy-btn { position: absolute; top: 8px; right: 8px; background: var(--active); border: none; color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
    .copy-btn:hover { background: var(--accent); color: #fff; }

    @media (max-width: 800px) {
      .layout { flex-direction: column; height: auto; }
      #sidebar { width: auto; max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
      main { padding: 20px 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nav-item, .nav-item:hover { transition: none; transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="layout">
    <nav id="sidebar" aria-label="Documentation">
      <div class="tools" role="search">
        <label for="search" class="skip">Search the documentation</label>
        <input id="search" type="search" placeholder="Search (press /)" autocomplete="off" aria-controls="results">
        <button id="theme" type="button" aria-label="Switch light or dark theme">◐</button>
      </div>
      <p class="hint" id="status" aria-live="polite"></p>
      <ul id="results" aria-label="Search results"></ul>
      <div id="pages"></div>
    </nav>
    <main id="content" tabindex="-1">Loading…</main>
  </div>
  <script src="app.js"></script>
</body>
</html>
